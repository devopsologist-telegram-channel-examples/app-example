doctrine:
    dbal:
        driver: pdo_pgsql
        server_version: '17'
        host: "%env(DB_HOST)%"
        port: "%env(DB_PORT)%"
        user: "%env(DB_USER)%"
        password: "%env(DB_PASSWORD)%"
        dbname: "%env(DB_NAME)%"
    orm:
        auto_generate_proxy_classes: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: false
        controller_resolver:
            auto_mapping: false