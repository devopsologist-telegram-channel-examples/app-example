stages:
    - build
    - push
    - deploy

build:
    stage: build
    script:
        - docker build -f ./docker/php-prod/Dockerfile -t ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA} .
    when: on_success
    only:
        - master
    tags:
        - app-example

push:
    stage: push
    before_script:
        - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
    after_script:
        - docker logout ${CI_REGISTRY}
    script:
        - docker push ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}
    when: on_success
    only:
        - master
    tags:
        - app-example

deploy:
    stage: deploy
    script:
        - sed -i "s|ci-registry-image|${CI_REGISTRY_IMAGE}|" .helm/values.yaml
        - sed -i "s/image-version/${CI_COMMIT_SHORT_SHA}/" .helm/values.yaml
        - helm repo add --username ${HELM_USER} --password ${HELM_PASS} app-example https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/helm/stable || true
        - helm package --version 0.1.${CI_JOB_ID} .helm/
        - helm cm-push app-example-0.1.${CI_JOB_ID}.tgz app-example
    when: on_success
    only:
        - master
    tags:
        - app-example