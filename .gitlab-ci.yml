stages:
    - build
    - push
    - deploy

build:
    stage: build
    script:
        - docker build -f ./docker/php/Dockerfile --target=prod-php -t ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA} .
    when: on_success
    only:
        - master
    tags:
        - app-example

push:
    stage: push
    before_script:
        - docker login -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD} ${CI_REGISTRY}
    after_script:
        - docker logout ${CI_REGISTRY}
    script:
        - docker push ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}
    when: on_success
    only:
        - master
    tags:
        - app-example

deploy:
    stage: deploy
    variables:
        CHART_DIR: .helm
        CHART_NAME: app-example
        CHART_REPO: ${CHART_NAME}
    before_script:
        - helm repo add --username ${HELM_USER} --password ${HELM_PASS} ${CHART_REPO} https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/helm/stable || true
    script:
        - echo "Получаем последнюю опубликованную версию Helm Chart из GitLab Package Registry"

        # Получаем список пакетов по API
        - PACKAGE_API="https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages?package_name=${CHART_NAME}&order_by=version&sort=desc"
        - 'RESPONSE=$(curl -s --header "JOB-TOKEN: $CI_JOB_TOKEN" "$PACKAGE_API")'

        # Извлекаем последнюю версию из JSON
        - LATEST_VERSION=$(echo "$RESPONSE" | jq -r '.[].version' | sort -V | tail -n 1)
        - |
            if [ -z "$LATEST_VERSION" ] || [ "$LATEST_VERSION" = "null" ]; then
              echo "Нет опубликованных версий — читаем из Chart.yaml"
              LATEST_VERSION=$(yq eval '.version' "$CHART_DIR/Chart.yaml")
            fi

        - 'echo "Последняя версия: $LATEST_VERSION"'

        # Инкремент patch-версии
        - IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_VERSION"
        - PATCH=$((PATCH + 1))
        - NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
        - 'echo "Новая версия: $NEW_VERSION"'

        # Пакуем и публикуем chart
        - echo "Пакуем и публикуем helm chart"
        - sed -i "s|ci-registry-image|${CI_REGISTRY_IMAGE}|" .helm/values.yaml
        - sed -i "s/image-version/${CI_COMMIT_SHORT_SHA}/" .helm/values.yaml
        - helm package --version ${NEW_VERSION} .helm/
        - helm cm-push ${CHART_NAME}-${NEW_VERSION}.tgz ${CHART_REPO}
    when: on_success
    only:
        - master
    needs:
        - push
    tags:
        - app-example